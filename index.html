<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111111">

  <meta
    name="description"
    content="Console — Oscar's Life Panel"
  >

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="stylesheet" href="./css/style.css">

  <title>Console</title>
</head>

<body>

  <!-- APP -->

  <main id="app">

    <section id="home" class="screen active">
      <h1>Console</h1>

      <div class="menu-grid">

        <button data-screen="rota">📅 Rota</button>
        <button data-screen="money">💷 Money</button>
        <button data-screen="fuel">⛽ Fuel</button>
        <button data-screen="hullfc">⚫ Hull FC</button>
        <button data-screen="food">🍔 Food Deals</button>
        <button data-screen="ai">🤖 AI</button>

      </div>
    </section>


    <section id="rota" class="screen">
      <button class="back-button" data-screen="home">← Home</button>
      <h2>Rota</h2>

      <div id="rotaContent"></div>
    </section>


    <section id="money" class="screen">
      <button class="back-button" data-screen="home">← Home</button>
      <h2>Money</h2>

      <div id="moneyContent"></div>
    </section>


    <section id="fuel" class="screen">
      <button class="back-button" data-screen="home">← Home</button>
      <h2>Fuel</h2>

      <div id="fuelContent"></div>
    </section>


    <section id="hullfc" class="screen">
      <button class="back-button" data-screen="home">← Home</button>
      <h2>Hull FC</h2>

      <div id="hullfcContent"></div>
    </section>


    <section id="food" class="screen">
      <button class="back-button" data-screen="home">← Home</button>

      <h2>🍔 Food Deals</h2>

      <p id="foodLastUpdated">
        Checking today's deals...
      </p>

      <div id="foodDeals"></div>
    </section>


    <section id="ai" class="screen">
      <button class="back-button" data-screen="home">← Home</button>
      <h2>🤖 AI</h2>

      <p>AI will be added later.</p>
    </section>

  </main>


  <script src="./js/data.js"></script>
  <script src="./js/food.js"></script>
  <script src="./js/app.js"></script>

</body>
</html>
